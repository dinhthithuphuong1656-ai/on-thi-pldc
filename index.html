<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ôn thi Pháp luật đại cương cùng Bé Mèo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#FFE9F3; --bg2:#F1ECFF;
  --card:#FFFFFF; --ink:#4A3557; --ink-soft:#86749A; --line:#F2D9E7;
  --pink:#D9407F; --pink-dark:#A92E62; --pink-soft:#FFD3E6;
  --lav:#8C6BEA; --lav-dark:#6A4CC4; --lav-soft:#ECE5FF;
  --ok:#25A863; --ok-bg:#DBF6E6; --no:#EE4B57; --no-bg:#FFE0E2;
  --t0:#FFBCD8; --t0d:#EE8DB7; --t1:#B2DEFF; --t1d:#79BDEE; --t2:#BDF0CF; --t2d:#7ED59E; --t3:#FFE6A3; --t3d:#EEC45A;
  --focus:#8C6BEA;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg1);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;color:var(--ink);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:16px;line-height:1.5;
  background:radial-gradient(circle at 1px 1px,rgba(217,64,127,.11) 1.3px,transparent 1.7px) 0 0/22px 22px,linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 100%);background-color:var(--bg1)}
button,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 56px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.display{font-family:"Baloo 2","Nunito",system-ui,sans-serif}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border:0;border-radius:999px;font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:1.0625rem;line-height:1.2;cursor:pointer;transition:transform .08s}
.btn.primary{background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pink-dark)}
.btn.soft{background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--line)}
.btn:active:not(:disabled){transform:translateY(3px)}
.btn.primary:active:not(:disabled){box-shadow:0 2px 0 var(--pink-dark)}
.btn.soft:active:not(:disabled){box-shadow:0 1px 0 var(--line)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:4px 0;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;cursor:pointer;font-weight:600}
.armed{color:var(--no)!important}

/* Home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:center;margin-top:4px}
.hero-mascot{grid-row:span 2}
.hero-mascot svg{display:block;animation:bob 2.6s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-5px) rotate(2deg)}}
.bubble{justify-self:start;position:relative;background:#fff;border-radius:16px;padding:8px 14px;font-weight:700;font-size:.9375rem;box-shadow:0 3px 0 var(--line)}
.bubble::before{content:"";position:absolute;left:-7px;bottom:12px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.hero h1{margin:0;font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:clamp(1.75rem,6vw,2.5rem);line-height:1.05;color:var(--pink)}
.lede{margin:14px 0 0;color:var(--ink-soft);font-weight:600;max-width:52ch}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.pill{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:.875rem;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
@media (max-width:520px){.quick{grid-template-columns:1fr}}
.qa{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border:0;border-radius:22px;cursor:pointer;transition:transform .08s}
.qa:active:not(:disabled){transform:translateY(3px)}
.qa:disabled{opacity:.55;cursor:not-allowed}
.qa.pink{background:var(--pink-soft);box-shadow:0 5px 0 #F2A9C9}
.qa.lav{background:var(--lav-soft);box-shadow:0 5px 0 #CDBFF6}
.qa-ico{flex:none;width:46px;height:46px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.4rem}
.qa b{display:block;font-family:"Baloo 2","Nunito",sans-serif;font-size:1.125rem;line-height:1.2}
.qa small{display:block;color:var(--ink-soft);font-weight:600;font-size:.8125rem}
.switches{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.switch{display:inline-flex;align-items:center;gap:10px;background:#fff;border:0;border-radius:999px;padding:6px 14px 6px 6px;font-weight:700;font-size:.875rem;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.switch .knob{width:40px;height:24px;border-radius:999px;background:#E6DDE9;position:relative;transition:background .15s}
.switch .knob::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.15);transition:left .15s}
.switch[aria-checked="true"] .knob{background:var(--ok)}
.switch[aria-checked="true"] .knob::after{left:19px}
h2.sec{font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:1.375rem;margin:30px 0 12px}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
@media (max-width:480px){.chapters{grid-template-columns:1fr 1fr;gap:12px}.chap{min-height:168px;padding:12px 12px 14px}.chap-ico{width:40px;height:40px;font-size:1.25rem}.chap-name{font-size:.9375rem}.chap-vi,.chap-meta{font-size:.75rem}}
.chap{display:flex;flex-direction:column;gap:4px;text-align:left;padding:14px 14px 16px;border:0;border-radius:22px;background:var(--cc);box-shadow:0 5px 0 var(--cd);cursor:pointer;transition:transform .08s;min-height:176px}
.chap:hover{transform:translateY(-2px)}
.chap:active{transform:translateY(3px);box-shadow:0 2px 0 var(--cd)}
.c0{--cc:#FFE0EE;--cd:#F4B4D0}.c1{--cc:#DDF0FF;--cd:#A9D3F3}.c2{--cc:#DCF7E6;--cd:#A6E1BD}.c3{--cc:#FFF2C8;--cd:#F1D987}.c4{--cc:#ECE5FF;--cd:#C9BBF5}.c5{--cc:#FFE7DA;--cd:#F5BFA4}
.chap-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px}
.chap-ico{width:48px;height:48px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:1.5rem}
.chap-no{font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:.875rem;background:rgba(255,255,255,.75);border-radius:999px;padding:2px 10px}
.chap-name{font-family:"Baloo 2","Nunito",sans-serif;font-weight:700;font-size:1.0625rem;line-height:1.2}
.chap-vi{font-size:.8125rem;color:var(--ink-soft);font-weight:600}
.chap-meta{margin-top:auto;padding-top:8px;font-size:.8125rem;font-weight:700}
.chap-bar{display:block;height:8px;border-radius:99px;background:rgba(255,255,255,.85);overflow:hidden;margin-top:6px}
.chap-bar i{display:block;height:100%;background:var(--ok);border-radius:99px}
details.box{margin-top:30px;background:#fff;border-radius:22px;padding:0 18px;box-shadow:0 4px 0 var(--line)}
details.box>summary{cursor:pointer;font-family:"Baloo 2","Nunito",sans-serif;font-weight:700;font-size:1.0625rem;padding:14px 0}
details.box[open]{padding-bottom:16px}
details.box p{margin:0 0 10px;font-size:.9375rem}
pre.sample{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.8125rem;line-height:1.55;background:#FFF7FB;border:1px dashed #F2B6D0;padding:12px 14px;border-radius:12px;overflow-x:auto;margin:0 0 12px}
textarea{display:block;width:100%;min-height:150px;padding:12px;border:2px solid var(--line);border-radius:14px;background:#FFFBFD;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.875rem;line-height:1.5;resize:vertical;margin-bottom:10px}
.msg{font-size:.9375rem;font-weight:700;margin:10px 0 0}
.msg.ok{color:var(--ok)}.msg.err{color:var(--no)}
.hint{color:var(--ink-soft);font-size:.875rem;font-weight:600;margin:8px 0 0}
footer.foot{margin-top:28px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px}
footer.foot .hint{margin:0;max-width:46ch}

/* Game */
.topbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.topbar .spacer{flex:1}
.icon-btn{flex:none;width:42px;height:42px;border-radius:50%;border:0;background:#fff;box-shadow:0 3px 0 var(--line);font-size:1.125rem;cursor:pointer;display:grid;place-items:center}
.icon-btn.armed{width:auto;padding:0 14px;border-radius:999px;font-size:.9375rem;font-weight:800}
.pill.hot{background:#FFF0D6}
.tbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.tbar .track{flex:1;height:12px;background:#fff;border-radius:999px;overflow:hidden;box-shadow:inset 0 0 0 2px var(--line)}
.tbar .fill{display:block;height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,var(--lav),var(--pink))}
.tbar.low .fill{background:var(--no)}
.tbar b{font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums}
.qcard{position:relative;background:#fff;border-radius:28px;padding:16px 20px 24px;box-shadow:0 6px 0 var(--line);text-align:center}
.qhead{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:6px}
.qhead svg{flex:none}
.qtopic{font-size:.8125rem;font-weight:700;color:var(--ink-soft);background:#FFF2F8;border-radius:999px;padding:3px 12px}
.qtext{margin:0 auto;max-width:36ch;font-family:"Baloo 2","Nunito",sans-serif;font-weight:700;font-size:clamp(1.25rem,3.4vw,1.625rem);line-height:1.3}
.qtext.long{max-width:52ch;font-size:clamp(1.0625rem,2.6vw,1.25rem);line-height:1.4}
.qtext:focus{outline:none}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
@media (max-width:560px){.tiles{grid-template-columns:1fr;gap:12px}}
.tile{position:relative;display:flex;align-items:center;gap:12px;min-height:96px;padding:14px 16px 16px;border:0;border-radius:20px;background:var(--tc);box-shadow:0 5px 0 var(--td);color:var(--ink);font-weight:700;font-size:1.0625rem;line-height:1.35;text-align:left;cursor:pointer;transition:transform .08s,opacity .15s}
@media (max-width:560px){.tile{min-height:64px;font-size:1rem}}
.tile:hover:not(:disabled){transform:translateY(-2px)}
.tile:active:not(:disabled){transform:translateY(3px);box-shadow:0 2px 0 var(--td)}
.tile:disabled{cursor:default}
.t0{--tc:var(--t0);--td:var(--t0d)}.t1{--tc:var(--t1);--td:var(--t1d)}.t2{--tc:var(--t2);--td:var(--t2d)}.t3{--tc:var(--t3);--td:var(--t3d)}
.tl{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.8);display:grid;place-items:center;font-family:"Baloo 2","Nunito",sans-serif;font-weight:800}
.tile.is-correct{--tc:var(--ok-bg);--td:var(--ok);outline:3px solid var(--ok)}
.tile.is-wrong{--tc:var(--no-bg);--td:var(--no);outline:3px solid var(--no);animation:shake .38s}
.tile.is-dim{opacity:.42}
.tile.is-picked{outline:4px solid var(--lav);outline-offset:2px}
.tile.is-picked .tl{background:var(--lav);color:#fff}
.mark{position:absolute;top:-10px;right:-8px;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:800;font-size:1rem;box-shadow:0 3px 0 rgba(74,53,87,.15)}
.is-correct .mark{background:var(--ok)}.is-wrong .mark{background:var(--no)}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
.game.answered{padding-bottom:150px}
.feedback{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-radius:26px 26px 0 0;border-top:6px solid var(--fb);box-shadow:0 -10px 30px rgba(74,53,87,.14);padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out both}
.feedback.ok{--fb:var(--ok)}.feedback.no{--fb:var(--no)}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
.fb-in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:12px}
.fb-in svg{flex:none}
.fb-text{flex:1;min-width:0}
.fb-title{margin:0;font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:1.375rem;line-height:1.1;color:var(--fb)}
.fb-sub{margin:2px 0 0;font-weight:700;font-size:.9375rem}
@media (max-width:520px){.fb-in{flex-wrap:wrap}.fb-in .btn{width:100%}}
.exam-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
.dots{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:18px 0}
.dot{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:800;font-size:.8125rem;cursor:pointer}
.dot.done{background:var(--lav);border-color:var(--lav);color:#fff}
.dot.cur{outline:3px solid var(--pink);outline-offset:1px}
.submit-row{display:flex;justify-content:center}
.kbd{display:none;text-align:center}
@media (hover:hover) and (pointer:fine){.kbd{display:block}}
.conf{position:fixed;width:9px;height:13px;border-radius:3px;pointer-events:none;z-index:60;animation:conf .9s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes conf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

/* Results */
.result{text-align:center;background:#fff;border-radius:30px;padding:22px 18px 26px;box-shadow:0 6px 0 var(--line)}
.result svg{display:block;margin:0 auto}
.stars{margin:6px 0 0;font-size:2.25rem;letter-spacing:.1em;color:#F5B83D;line-height:1}
.stars .off{color:#EADFEA}
.r-score{margin:6px 0 0;font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:clamp(2.25rem,9vw,3.25rem);line-height:1;color:var(--pink)}
.r-sub{margin:8px auto 0;max-width:44ch;font-weight:700}
.r-pills{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.r-pills .pill{background:#FFF5FA}
.r-actions{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:20px}
.review{margin-top:24px}
.review h2{font-family:"Baloo 2","Nunito",sans-serif;font-weight:800;font-size:1.25rem;margin:0 0 10px}
.rev{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:10px;box-shadow:0 3px 0 var(--line)}
.rev p{margin:0}
.rev-q{font-weight:700;margin-bottom:6px!important}
.rev-a{font-size:.9375rem;font-weight:600}
.rev-a.no{color:var(--no)}.rev-a.ok{color:var(--ok)}
.rev-code{font-size:.75rem;color:var(--ink-soft);font-weight:700;margin-bottom:4px!important}
details.review-right{margin-top:12px}
details.review-right>summary{cursor:pointer;font-weight:800;padding:8px 0}
@media (prefers-reduced-motion:reduce){.hero-mascot svg,.tile.is-wrong,.feedback{animation:none}.conf{display:none}}
</style>
</head>

  {"id": "S1-04", "c": "S1-04", "t": "1. Meaning and basic concepts of law", "q": "Which example shows a legal rule?", "o": ["Drivers must stop at a red traffic light", "Friends should reply to messages quickly", "People should give birthday presents", "Guests should thank their hosts"], "a": 0, "e": ""},

  {"id": "S1-15", "c": "S1-15", "t": "1. Meaning and basic concepts of law", "q": "Which topic most clearly belongs to public international law?", "o": ["A neighbour’s ordinary property boundary dispute", "A shop’s internal staff rota", "Treaty obligations between states", "The terms of a local household sale"], "a": 2, "e": ""},

  {"id": "S1-17", "c": "S1-17", "t": "1. Meaning and basic concepts of law", "q": "Which statement is an example of a substantive legal rule?", "o": ["A rule defining the rights and duties of parties to a contract", "A rule fixing the deadline for filing an appeal", "A rule specifying how to serve court documents", "A rule governing the order of witnesses at trial"], "a": 0, "e": ""},
  {"id": "S1-18", "c": "S1-18", "t": "1. Meaning and basic concepts of law", "q": "What is the principal focus of procedural law?", "o": ["Whether a particular moral belief is popular", "The processes through which legal rights and duties are enforced", "Only the ownership of intangible assets", "The substantive definition of every criminal offence"], "a": 1, "e": ""},
  {"id": "S2-01", "c": "S2-01", "t": "2. Source of law", "q": "What is meant by a “source of law”?", "o": ["Only the historical origin of a legal system", "A recognized form or authority from which legal rules derive their legal validity", "Any social practice followed by a community", "Any opinion expressed by a judge"], "a": 1, "e": ""},
  {"id": "S2-02", "c": "S2-02", "t": "2. Source of law", "q": "Which of the following is an example of legislation?", "o": ["A social custom followed for many generations", "An academic article discussing criminal law", "An Act passed by Parliament", "A private agreement between two individuals"], "a": 2, "e": ""},
  {"id": "S2-03", "c": "S2-03", "t": "2. Source of law", "q": "What is the main difference between legislation and judicial precedent?", "o": ["Legislation is created by the legislature, while precedent develops through judicial decisions", "Legislation applies only to criminal cases, while precedent applies only to civil cases", "Legislation is always unwritten, while precedent is always written", "There is no significant difference between them"], "a": 0, "e": ""},
  {"id": "S2-04", "c": "S2-04", "t": "2. Source of law", "q": "When can a social custom become customary law?", "o": ["Whenever a large number of people follow it", "When it has existed for at least ten years", "When it is recognized by the legal system as having legal force", "When it is written down by members of the community"], "a": 2, "e": ""},
  {"id": "S2-05", "c": "S2-05", "t": "2. Source of law", "q": "Which statement best describes judicial precedent?", "o": ["Parliament creates a general rule that courts must apply", "A legal principle established in a previous judicial decision may guide or bind courts in later similar cases", "Judges are free to ignore all previous judicial decisions", "A precedent is a custom that has been practiced for a long period"], "a": 1, "e": ""},
  {"id": "S2-06", "c": "S2-06", "t": "2. Source of law", "q": "What is secondary legislation?", "o": ["Legislation that is less important and can therefore be ignored", "Law made by courts when deciding cases", "Law made under powers delegated by primary legislation", "Old legislation that is no longer in force"], "a": 2, "e": ""},
  {"id": "S2-07", "c": "S2-07", "t": "2. Source of law", "q": "In John Austin’s command theory of law, what is the role of the “sovereign”?", "o": ["The sovereign interprets customs but cannot create law", "The sovereign is the ultimate political authority whose commands, backed by sanctions, constitute positive law", "The sovereign refers only to the judiciary", "The sovereign must always be an elected parliament"], "a": 1, "e": ""},
  {"id": "S2-08", "c": "S2-08", "t": "2. Source of law", "q": "Which part of a common law judgment normally contains the legal rule necessary for the decision?", "o": ["The names of the parties", "Every observation made by the judge", "The ratio decidendi", "The procedural timetable"], "a": 2, "e": ""},
  {"id": "S2-09", "c": "S2-09", "t": "2. Source of law", "q": "What is an obiter dictum?", "o": ["A rule enacted by the legislature", "A binding order made by a minister", "A constitutional amendment", "A judicial observation not necessary to decide the case"], "a": 3, "e": ""},
  {"id": "S2-10", "c": "S2-10", "t": "2. Source of law", "q": "In a common law court hierarchy, which earlier decision will ordinarily bind a lower court in a materially similar case?", "o": ["A relevant decision of a higher court in the same hierarchy", "A decision of any foreign court", "An academic commentary on an unrelated judgment", "A newspaper summary of a trial"], "a": 0, "e": ""},
  {"id": "S2-11", "c": "S2-11", "t": "2. Source of law", "q": "What does it mean for a court to distinguish an earlier case?", "o": ["To repeal the statute applied in that case", "To explain that material differences make the earlier rule inapplicable", "To transfer the dispute to the legislature", "To declare that no judicial decisions can be used"], "a": 1, "e": ""},
  {"id": "S2-12", "c": "S2-12", "t": "2. Source of law", "q": "Which statement best describes persuasive authority?", "o": ["A rule that automatically repeals conflicting legislation", "A source that binds every court in every country", "A source a court may consider but is not legally required to follow", "A source that can never affect legal reasoning"], "a": 2, "e": ""},
  {"id": "S2-13", "c": "S2-13", "t": "2. Source of law", "q": "In the UK, what is the legal status of a Bill that has been introduced but has not completed the enactment process?", "o": ["It is already an Act of Parliament", "It is binding customary law", "It is a judicial precedent", "It is proposed legislation rather than an enacted Act"], "a": 3, "e": ""},
  {"id": "S2-14", "c": "S2-14", "t": "2. Source of law", "q": "Why do lawyers check whether a statute has been amended?", "o": ["To identify the version applicable to the relevant issue and time", "To replace its text with academic opinion", "To establish that all earlier versions were unlawful", "To show that judicial decisions are unnecessary"], "a": 0, "e": ""},
  {"id": "S2-15", "c": "S2-15", "t": "2. Source of law", "q": "What does express repeal of a statutory provision mean?", "o": ["A court postpones a hearing concerning it", "Later legislation expressly removes its legal force", "An official chooses not to enforce it in one case", "An academic criticizes its wording"], "a": 1, "e": ""},
  {"id": "S2-16", "c": "S2-16", "t": "2. Source of law", "q": "Under the ordinary UK doctrine of parliamentary sovereignty, what happens when an Act clearly changes a conflicting common law rule?", "o": ["The Act needs approval from every trial judge", "The common law rule always defeats the Act", "The Act governs, subject to its proper interpretation and application", "The common law rule becomes a constitutional amendment"], "a": 2, "e": ""},
  {"id": "S2-17", "c": "S2-17", "t": "2. Source of law", "q": "Which source normally helps explain the law without itself having binding legal force merely because of its authorship?", "o": ["A valid Act of Parliament", "A binding judgment of a superior court", "A valid regulation made under statutory authority", "A legal textbook written by a scholar"], "a": 3, "e": ""},
  {"id": "S3-01", "c": "S3-01", "t": "3. Rule of law", "q": "Which statement best describes the Rule of Law?", "o": ["Government officials may act freely whenever they believe it is necessary", "Everyone, including the government, is subject to the law", "Only citizens are required to obey the law", "Courts must follow the decisions of the executive branch"], "a": 1, "e": ""},
  {"id": "S3-02", "c": "S3-02", "t": "3. Rule of law", "q": "Which of the following is NOT one of the three traditional principles of the Rule of Law?", "o": ["Supremacy of law", "Equality before the law", "Predominance of the legal spirit", "Separation of powers"], "a": 3, "e": ""},
  {"id": "S3-03", "c": "S3-03", "t": "3. Rule of law", "q": "What is meant by the “supremacy of law”?", "o": ["Parliament may exercise unlimited administrative power", "No person may be punished except for a breach of law established through ordinary legal procedures", "Judges have the power to create any law they consider fair", "Constitutional law is superior to all other forms of law"], "a": 1, "e": ""},
  {"id": "S3-04", "c": "S3-04", "t": "3. Rule of law", "q": "Which situation best illustrates “equality before the law”?", "o": ["A government minister is exempt from criminal law because of their official position", "Public officials and ordinary citizens are generally subject to the same law administered by ordinary courts", "Government officials are always tried by special courts", "Wealthy citizens receive different legal rights from other citizens"], "a": 1, "e": ""},
  {"id": "S3-05", "c": "S3-05", "t": "3. Rule of law", "q": "“Predominance of the legal spirit” mainly refers to the idea that:", "o": ["constitutional principles and individual rights have developed through judicial decisions in concrete cases", "judges should always have greater power than Parliament", "all constitutional rules must be contained in a single written constitution", "Moral principles should prevail over positive law"], "a": 0, "e": ""},
  {"id": "S3-06", "c": "S3-06", "t": "3. Rule of law", "q": "A police officer arrests a person simply because the officer dislikes the person’s political opinions. There is no legal basis for the arrest. Which Rule of Law principle is most directly violated?", "o": ["Supremacy of law", "Parliamentary sovereignty", "Federalism", "Separation of religion and state"], "a": 0, "e": ""},
  {"id": "S3-07", "c": "S3-07", "t": "3. Rule of law", "q": "A new law imposes a criminal penalty for an act that was lawful when a person committed it. Which Rule of Law requirement is most directly concerned?", "o": ["Legal certainty and non-retroactivity", "Judicial independence", "Equality before the law", "Majority rule"], "a": 0, "e": ""},
  {"id": "S3-08", "c": "S3-08", "t": "3. Rule of law", "q": "Why is judicial independence important to the Rule of Law?", "o": ["It allows judges to ignore legislation", "It enables courts to apply the law impartially without improper interference from other actors", "It gives judges complete control over government policy", "It prevents citizens from challenging government decisions"], "a": 1, "e": ""},
  {"id": "S3-09", "c": "S3-09", "t": "3. Rule of law", "q": "Which of the following is the BEST example of arbitrary government power?", "o": ["A court sentences a defendant according to a criminal statute", "A tax authority imposes a penalty according to published tax regulations", "A government agency closes a business without any legal authority or established procedure", "Parliament adopts a law after following the required legislative procedure"], "a": 2, "e": ""},
  {"id": "S3-10", "c": "S3-10", "t": "3. Rule of law", "q": "Which statement best explains the relationship between the Rule of Law and government power?", "o": ["The Rule of Law means that government cannot exercise power", "The Rule of Law requires government power to be exercised according to law and subject to legal constraints", "The Rule of Law requires courts to govern the country", "The Rule of Law means that every government decision must be approved by citizens"], "a": 1, "e": ""},
  {"id": "S3-11", "c": "S3-11", "t": "3. Rule of law", "q": "Why should legal rules be publicly accessible?", "o": ["So that only government lawyers can interpret them", "So that courts may replace evidence with publicity", "So that people can learn the rules governing their conduct", "So that officials can enforce unpublished exceptions"], "a": 2, "e": ""},
  {"id": "S3-12", "c": "S3-12", "t": "3. Rule of law", "q": "Which feature most directly supports clarity in legal rules?", "o": ["Issuing contradictory instructions without guidance", "Changing the meaning of a rule secretly", "Leaving prohibited conduct entirely to each official’s preference", "Using wording that affected people can reasonably understand"], "a": 3, "e": ""},
  {"id": "S3-13", "c": "S3-13", "t": "3. Rule of law", "q": "Why can frequent and unpredictable changes to legal rules undermine legal certainty?", "o": ["They make it harder for people to plan their conduct under the law", "They remove all need for judicial interpretation", "They prevent the legislature from considering public concerns", "They necessarily make every new rule invalid"], "a": 0, "e": ""},
  {"id": "S3-14", "c": "S3-14", "t": "3. Rule of law", "q": "Which arrangement most directly promotes access to justice?", "o": ["Allowing only public officials to bring legal claims", "Providing practical access to legal advice and appropriate dispute-resolution procedures", "Making every government decision immune from review", "Requiring political approval before every civil claim"], "a": 1, "e": ""},
  {"id": "S3-15", "c": "S3-15", "t": "3. Rule of law", "q": "A judge has a personal financial interest in the outcome of a dispute. Which requirement is most directly at risk?", "o": ["Territorial sovereignty", "Parliamentary privilege", "Judicial impartiality", "The publicity of legislation"], "a": 2, "e": ""},
  {"id": "S3-16", "c": "S3-16", "t": "3. Rule of law", "q": "Which procedure best supports a fair hearing before a public authority makes an adverse decision?", "o": ["Relying on a secret allegation that cannot be answered", "Deciding the case before receiving any submissions", "Treating the official’s preference as conclusive evidence", "Giving the affected person a meaningful opportunity to know and answer the case"], "a": 3, "e": ""},
  {"id": "S3-17", "c": "S3-17", "t": "3. Rule of law", "q": "Which statement best distinguishes the Rule of Law from mere rule by law?", "o": ["The Rule of Law also requires legal constraints on those exercising public power", "Any written rule necessarily protects fundamental rights", "Rule by law always requires independent judicial review", "The Rule of Law permits officials to disregard legal procedures"], "a": 0, "e": ""},
  {"id": "S4-01", "c": "S4-01", "t": "4. Legal system", "q": "Which of the following is an important element used to distinguish one legal system from another?", "o": ["The size of the country", "Sources of law", "The number of citizens", "The official language of the country"], "a": 1, "e": ""},
  {"id": "S4-02", "c": "S4-02", "t": "4. Legal system", "q": "Which statement BEST describes the traditional difference between Civil Law and Common Law systems?", "o": ["Civil Law relies exclusively on legislation, while Common Law has no legislation", "Civil Law places greater emphasis on legislation, while Common Law gives a broader role to case law", "Civil Law is based on religion, while Common Law is not", "Common Law does not recognise statutes"], "a": 1, "e": ""},
  {"id": "S4-03", "c": "S4-03", "t": "4. Legal system", "q": "Which of the following countries is traditionally associated with the Common Law system?", "o": ["France", "Germany", "Australia", "Vietnam"], "a": 2, "e": ""},
  {"id": "S4-04", "c": "S4-04", "t": "4. Legal system", "q": "In which country did the common law tradition historically develop?", "o": ["France", "England", "Germany", "Italy"], "a": 1, "e": ""},
  {"id": "S4-05", "c": "S4-05", "t": "4. Legal system", "q": "Which type of reasoning is traditionally associated with Civil Law?", "o": ["Deductive reasoning", "Inductive reasoning", "Mathematical reasoning", "Moral reasoning"], "a": 0, "e": ""},
  {"id": "S4-06", "c": "S4-06", "t": "4. Legal system", "q": "In the traditional Common Law model, what is the primary role of a judge in an adversarial proceeding?", "o": ["To actively investigate the facts for both parties", "To act as a relatively neutral decision-maker between opposing parties", "To draft legislation for Parliament", "To represent the defendant"], "a": 1, "e": ""},
  {"id": "S4-07", "c": "S4-07", "t": "4. Legal system", "q": "Which statement BEST describes an inquisitorial system?", "o": ["The judge generally plays a more active role in investigating the case and establishing the facts", "The judge acts only as a neutral referee between the parties", "Only lawyers are permitted to collect evidence", "Previous judicial decisions are always the main source of law"], "a": 0, "e": ""},
  {"id": "S4-08", "c": "S4-08", "t": "4. Legal system", "q": "A court is deciding a new case. Instead of relying mainly on a comprehensive legal code, it examines decisions from earlier similar cases and derives a legal principle from them. This approach is MOST characteristic of:", "o": ["Civil Law", "Common Law", "Islamic Law", "Socialist Law"], "a": 1, "e": ""},
  {"id": "S4-09", "c": "S4-09", "t": "4. Legal system", "q": "Which legal tradition is historically most closely associated with Roman law and comprehensive codification?", "o": ["The common law tradition", "The civil law tradition", "A system based exclusively on religious doctrine", "A system without written legal rules"], "a": 1, "e": ""},
  {"id": "S4-10", "c": "S4-10", "t": "4. Legal system", "q": "Which description best captures a legal code in the civil law tradition?", "o": ["A collection of press reports about court decisions", "An informal agreement among judges", "An organized legislative statement of rules governing a field of law", "A list of customs with no recognized legal effect"], "a": 2, "e": ""},
  {"id": "S4-11", "c": "S4-11", "t": "4. Legal system", "q": "In comparative law, a mixed legal system generally combines:", "o": ["The legislature and judiciary into a single institution", "Only civil and criminal offences in one court", "Two official languages in every statute", "Significant elements of more than one legal tradition"], "a": 3, "e": ""},
  {"id": "S4-12", "c": "S4-12", "t": "4. Legal system", "q": "Which statement about legislation in common law systems is accurate?", "o": ["Legislation is an important source of law alongside judicial decisions", "Only courts may create binding legal rules", "Legislation is legally irrelevant once a precedent exists", "Statutes can govern procedure but never substantive rights"], "a": 0, "e": ""},
  {"id": "S4-13", "c": "S4-13", "t": "4. Legal system", "q": "What does inductive legal reasoning generally involve?", "o": ["Applying a general code provision to a specific set of facts", "Developing a broader principle from particular decided cases", "Ignoring similarities between earlier decisions", "Treating a political statement as an enacted statute"], "a": 1, "e": ""},
  {"id": "S4-14", "c": "S4-14", "t": "4. Legal system", "q": "Which statement about judges in civil law systems is most accurate?", "o": ["They never interpret legal texts", "They decide cases only by public referendum", "They interpret and apply legal rules, even where codes are central", "They have no role in resolving uncertain wording"], "a": 2, "e": ""},
  {"id": "S4-15", "c": "S4-15", "t": "4. Legal system", "q": "Which feature is most closely associated with an adversarial model of proceedings?", "o": ["Witnesses cannot be questioned by either side", "The judge acts as counsel for both parties", "The legislature decides the individual dispute", "Opposing parties take a leading role in presenting evidence and arguments"], "a": 3, "e": ""},
  {"id": "S4-16", "c": "S4-16", "t": "4. Legal system", "q": "What does the term jurisdiction principally describe?", "o": ["A court’s legal authority to hear and determine a matter", "The political popularity of a judgment", "The number of lawyers employed by a court", "The language used in a published statute"], "a": 0, "e": ""},
  {"id": "S4-17", "c": "S4-17", "t": "4. Legal system", "q": "Why should the common law and civil law distinction be treated as a broad comparative model?", "o": ["Every country follows exactly the same procedural rules", "National systems vary and may combine features of both traditions", "Only common law systems have professional judges", "Civil law systems cannot change over time"], "a": 1, "e": ""},
  {"id": "S5-01", "c": "S5-01", "t": "5. Forms of government", "q": "Which of the following best describes a government?", "o": ["A group of private companies operating in a country", "An institution or system made up of people governing an organized community", "A political party that wins an election", "A court that interprets laws"], "a": 1, "e": ""},
  {"id": "S5-02", "c": "S5-02", "t": "5. Forms of government", "q": "According to the lecture, government normally consists of which three branches?", "o": ["Legislature, executive, and judiciary", "Parliament, political parties, and citizens", "President, military, and courts", "Central government, local government, and political parties"], "a": 0, "e": ""},
  {"id": "S5-03", "c": "S5-03", "t": "5. Forms of government", "q": "Which two criteria can be used to distinguish different forms of government?", "o": ["Population and territory", "Economic system and culture", "Power source and power structure", "Religion and history"], "a": 2, "e": ""},
  {"id": "S5-04", "c": "S5-04", "t": "5. Forms of government", "q": "The question “Who rules?” mainly refers to:", "o": ["Power structure", "Power source", "Separation of powers", "Decentralization"], "a": 1, "e": ""},
  {"id": "S5-05", "c": "S5-05", "t": "5. Forms of government", "q": "Which form of government places political power in the people?", "o": ["Monarchy", "Oligarchy", "Democracy", "Dictatorship"], "a": 2, "e": ""},
  {"id": "S5-06", "c": "S5-06", "t": "5. Forms of government", "q": "Which statement best describes a democracy?", "o": ["The monarch makes all important political decisions", "Political power belongs to a small group of people", "Leaders are elected by the people, and power is exercised directly or through representatives", "Political power is inherited within a family"], "a": 2, "e": ""},
  {"id": "S5-07", "c": "S5-07", "t": "5. Forms of government", "q": "In a direct democracy, citizens:", "o": ["Exercise political power directly", "Transfer all political power to a monarch", "Are governed by judges", "Do not participate in political decisions"], "a": 0, "e": ""},
  {"id": "S5-08", "c": "S5-08", "t": "5. Forms of government", "q": "Which statement about a republic is correct?", "o": ["Every republic is necessarily democratic", "A republic must have a king or queen", "The head of state is not a hereditary monarch and is selected under the constitutional rules", "The head of state always holds office for life"], "a": 2, "e": ""},
  {"id": "S5-09", "c": "S5-09", "t": "5. Forms of government", "q": "Why are “republic” and “democracy” NOT identical concepts?", "o": ["A republic never holds elections", "Some republics may not operate democratically", "Democracy always requires a monarch", "Republics do not have governments"], "a": 1, "e": ""},
  {"id": "S5-10", "c": "S5-10", "t": "5. Forms of government", "q": "Which feature best distinguishes a presidential system from a parliamentary system?", "o": ["The head of state inherits office", "The executive has a separate constitutional mandate and does not depend on ordinary parliamentary confidence to remain in office", "The prime minister is necessarily the head of state", "The cabinet remains in office only while it has parliamentary confidence"], "a": 1, "e": ""},
  {"id": "S5-11", "c": "S5-11", "t": "5. Forms of government", "q": "Which country is an example of a presidential republic?", "o": ["France", "Germany", "United States", "United Kingdom"], "a": 2, "e": ""},
  {"id": "S5-12", "c": "S5-12", "t": "5. Forms of government", "q": "In a parliamentary republic, the executive:", "o": ["Derives its power from parliament and is accountable to parliament", "Is completely separate from parliament", "Is headed by a hereditary monarch", "Is directly elected by the people in all cases"], "a": 0, "e": ""},
  {"id": "S5-13", "c": "S5-13", "t": "5. Forms of government", "q": "A country has a popularly elected president with meaningful constitutional powers and a prime minister whose cabinet is responsible to parliament. Which system best describes it?", "o": ["Presidential republic", "Parliamentary republic", "Semi-presidential republic", "Absolute monarchy"], "a": 2, "e": ""},
  {"id": "S5-14", "c": "S5-14", "t": "5. Forms of government", "q": "Which organizational principle is associated with the classical socialist model of state organization?", "o": ["Strict separation of powers", "Democratic centralism", "Hereditary political leadership", "Absolute power of the monarch"], "a": 1, "e": ""},
  {"id": "S5-15", "c": "S5-15", "t": "5. Forms of government", "q": "What is the main difference between an absolute monarchy and a constitutional monarchy?", "o": ["Only constitutional monarchies have a monarch", "In an absolute monarchy, the monarch has absolute or very great power; in a constitutional monarchy, the monarch’s powers are restricted by the constitution", "Absolute monarchies always have elected prime ministers", "Constitutional monarchs are directly elected by citizens"], "a": 1, "e": ""},
  {"id": "S5-16", "c": "S5-16", "t": "5. Forms of government", "q": "In many constitutional monarchies, the king or queen:", "o": ["Makes all laws personally", "Has mainly ceremonial duties", "Controls the judiciary", "Serves as prime minister"], "a": 1, "e": ""},
  {"id": "S5-17", "c": "S5-17", "t": "5. Forms of government", "q": "Political power is concentrated in a small group of wealthy families and business elites. Which classification best fits this arrangement?", "o": ["Democracy", "Oligarchy", "Constitutional monarchy", "Transitional government"], "a": 1, "e": ""},
  {"id": "S5-18", "c": "S5-18", "t": "5. Forms of government", "q": "Country X is governed by a religious leader whose authority is based primarily on religion. Which form of government best describes Country X?", "o": ["Oligarchy", "Theocracy", "Republic", "Federalism"], "a": 1, "e": ""},
  {"id": "S6-01", "c": "S6-01", "t": "6. Constitutional law", "q": "What is a constitution?", "o": ["The fundamental rules organizing a state and its public powers", "An administrative manual for one ministry", "A political party manifesto with no legal function", "A private contract between citizens"], "a": 0, "e": ""},
  {"id": "S6-02", "c": "S6-02", "t": "6. Constitutional law", "q": "Which statement best describes the constitutional protection of fundamental rights?", "o": ["It allows ordinary officials to remove rights without legal limits", "It provides a legal framework for recognizing and protecting fundamental rights", "It guarantees that no right can ever be limited in any circumstances", "It concerns relations between businesses only"], "a": 1, "e": ""},
  {"id": "S6-03", "c": "S6-03", "t": "6. Constitutional law", "q": "Under Article 119 of the Vietnamese Constitution, which statement is correct?", "o": ["An ordinary statute may override the Constitution", "Only judicial decisions must comply with the Constitution", "The Constitution has the highest legal effect and all other legal documents must conform to it", "A ministerial circular has the same legal effect as the Constitution"], "a": 2, "e": ""},
  {"id": "S6-04", "c": "S6-04", "t": "6. Constitutional law", "q": "Under Article 2 of the Vietnamese Constitution, all state power belongs to:", "o": ["The Government alone", "The judiciary alone", "The Communist Party as a state organ", "The People"], "a": 3, "e": ""},
  {"id": "S6-05", "c": "S6-05", "t": "6. Constitutional law", "q": "Under Article 4 of the Vietnamese Constitution, Party organizations and Party members must operate:", "o": ["Outside the legal framework applicable to public institutions", "Within the framework of the Constitution and law", "Only under internal rules, regardless of the Constitution", "Without supervision by the People"], "a": 1, "e": ""},
  {"id": "S6-06", "c": "S6-06", "t": "6. Constitutional law", "q": "Which of the following is NOT a main purpose of a constitution?", "o": ["To establish the framework of government", "To protect fundamental rights", "To regulate every daily administrative decision", "To define the powers of state institutions"], "a": 2, "e": ""},
  {"id": "S6-07", "c": "S6-07", "t": "6. Constitutional law", "q": "What is the central idea of constitutionalism?", "o": ["Public power should be limited and exercised under constitutional rules", "Any government with a written document necessarily has unlimited lawful authority", "The executive may disregard constitutional limits during ordinary administration", "A constitution regulates private conduct but never government power"], "a": 0, "e": ""},
  {"id": "S6-08", "c": "S6-08", "t": "6. Constitutional law", "q": "Which political philosopher is closely associated with the modern doctrine of separation of powers?", "o": ["John Locke", "Jean-Jacques Rousseau", "Thomas Hobbes", "Montesquieu"], "a": 3, "e": ""},
  {"id": "S6-09", "c": "S6-09", "t": "6. Constitutional law", "q": "Which branch of government is primarily responsible for enforcing laws?", "o": ["The legislative branch", "The executive branch", "The judicial branch", "The constitutional court"], "a": 1, "e": ""},
  {"id": "S6-10", "c": "S6-10", "t": "6. Constitutional law", "q": "Under the Vietnamese Constitution, which institution is the highest representative body of the People and the highest body of state power?", "o": ["The Government", "The State President", "The National Assembly", "The People’s Courts"], "a": 2, "e": ""},
  {"id": "S6-11", "c": "S6-11", "t": "6. Constitutional law", "q": "Under the Vietnamese Constitution, which institution exercises judicial power?", "o": ["The National Assembly", "The Government", "The State President", "The People’s Courts"], "a": 3, "e": ""},
  {"id": "S6-12", "c": "S6-12", "t": "6. Constitutional law", "q": "What does it mean to describe a constitution as codified?", "o": ["Every rule can be changed by a ministerial instruction", "None of its rules has been written down", "Its principal constitutional rules are collected in a single constitutional document", "It contains all private contracts made in the state"], "a": 2, "e": ""},
  {"id": "S6-13", "c": "S6-13", "t": "6. Constitutional law", "q": "An uncodified constitution is best understood as one whose rules:", "o": ["Have no legal or political significance", "Are entirely oral and cannot appear in legislation", "Must be applied only by a hereditary monarch", "Are not collected in one comprehensive constitutional document"], "a": 3, "e": ""},
  {"id": "S6-14", "c": "S6-14", "t": "6. Constitutional law", "q": "What normally distinguishes a rigid constitution from a flexible constitution?", "o": ["A rigid constitution requires a more demanding amendment procedure than ordinary legislation", "A rigid constitution cannot be interpreted by courts", "A flexible constitution contains no rules about government", "A flexible constitution cannot recognize rights"], "a": 0, "e": ""},
  {"id": "S6-15", "c": "S6-15", "t": "6. Constitutional law", "q": "What is the central purpose of checks and balances in constitutional design?", "o": ["To ensure that one branch exercises every public function", "To allow institutions to restrain or oversee one another’s exercise of power", "To replace legal accountability with political loyalty", "To remove all cooperation between public institutions"], "a": 1, "e": ""},
  {"id": "S6-16", "c": "S6-16", "t": "6. Constitutional law", "q": "Under Article 2 of the Vietnamese Constitution, how is state power organized?", "o": ["The courts exercise legislative and executive powers exclusively", "Each branch is a separate sovereign state", "It is unified, with assignment, coordination and control among state bodies exercising legislative, executive and judicial powers", "The Government is constitutionally independent of every other state body"], "a": 2, "e": ""},
  {"id": "S6-17", "c": "S6-17", "t": "6. Constitutional law", "q": "Under Article 14 of the Vietnamese Constitution, which statement about limiting human rights and citizens’ rights is correct?", "o": ["Any administrative instruction may restrict rights for convenience", "Rights may never be limited under any circumstances", "An individual official may restrict rights without giving a legal basis", "Restrictions must be prescribed by law and be necessary for the constitutionally specified reasons"], "a": 3, "e": ""},
  {"id": "S7-01", "c": "S7-01", "t": "7. Civil law part 1", "q": "The term civil law primarily refers to:", "o": ["The branch governing private personal and property relations", "Only a legal tradition originating in continental Europe", "Rules defining crimes and imprisonment only", "The organization of the executive branch only"], "a": 0, "e": ""},
  {"id": "S7-02", "c": "S7-02", "t": "7. Civil law part 1", "q": "Under the equality principle in civil relations, which statement is correct?", "o": ["A public organization always has superior civil rights because of its status", "The parties participate on an equal legal footing, without status-based discrimination", "A wealthier party may impose obligations without agreement", "Every party must possess identical assets"], "a": 1, "e": ""},
  {"id": "S7-03", "c": "S7-03", "t": "7. Civil law part 1", "q": "Which principle is most directly undermined when a party is forced to enter a civil transaction?", "o": ["The publicity of court hearings", "The hierarchy of criminal punishments", "Freedom and voluntariness in establishing civil relations", "The nationality principle"], "a": 2, "e": ""},
  {"id": "S7-04", "c": "S7-04", "t": "7. Civil law part 1", "q": "What does good faith and honesty require in civil relations?", "o": ["A party may conceal every material fact without legal consequences", "A stronger party may deliberately mislead the other party", "Only a written contract requires honest conduct", "Parties should establish and perform civil rights and obligations honestly and in good faith"], "a": 3, "e": ""},
  {"id": "S7-05", "c": "S7-05", "t": "7. Civil law part 1", "q": "What is the main compensatory purpose of a civil remedy?", "o": ["To restore the injured party, so far as possible, to the position before the harm", "To impose imprisonment whenever loss occurs", "To transfer all of the defendant’s property to the state", "To create a criminal record for every unsuccessful defendant"], "a": 0, "e": ""},
  {"id": "S7-06", "c": "S7-06", "t": "7. Civil law part 1", "q": "Which description best identifies tort or non-contractual civil liability?", "o": ["Liability arising exclusively from an inheritance tax", "Civil liability for harm that does not depend on breach of a contract between the parties", "A penalty imposed solely for breaching a parliamentary rule", "Only liability for violating an employment contract"], "a": 1, "e": ""},
  {"id": "S7-07", "c": "S7-07", "t": "7. Civil law part 1", "q": "Which statement best describes the possible relationship between civil and criminal liability for the same harmful conduct?", "o": ["A criminal prosecution always removes the victim’s civil claim", "A civil claim automatically prevents criminal prosecution", "The conduct may give rise to criminal proceedings and a claim for civil compensation", "Civil compensation can be ordered only if the conduct is not criminal"], "a": 2, "e": ""},
  {"id": "S7-08", "c": "S7-08", "t": "7. Civil law part 1", "q": "Which matter most clearly falls within property law?", "o": ["The procedure for adopting a constitutional amendment", "The age at which criminal liability begins", "The appointment of a country’s prime minister", "The ownership and exercise of rights over assets"], "a": 3, "e": ""},
  {"id": "S7-09", "c": "S7-09", "t": "7. Civil law part 1", "q": "Lan agrees to pay Minh VND 3 million for his bicycle. Minh hands over the bicycle and transfers ownership to Lan in exchange for the payment. What type of contract is this?", "o": ["A sale contract", "A gift contract", "A lease contract", "A loan contract"], "a": 0, "e": ""},
  {"id": "S8-01", "c": "S8-01", "t": "8. Civil law part 2", "q": "Under the Civil Code definition, a contract is an agreement intended to:", "o": ["Establish, modify or terminate civil rights and obligations", "Appoint the legislature", "Determine criminal guilt", "Replace the Constitution"], "a": 0, "e": ""},
  {"id": "S8-02", "c": "S8-02", "t": "8. Civil law part 2", "q": "A company uses a photographer’s picture in an advertisement without her permission. The photographer objects to the use of her work. Which area of law is most directly involved?", "o": ["Contract law", "Succession law", "Intellectual property law", "Marriage and family law"], "a": 2, "e": ""},
  {"id": "S8-03", "c": "S8-03", "t": "8. Civil law part 2", "q": "Which statement about the form of a civil transaction in Vietnam is correct?", "o": ["Only a handwritten document can create civil obligations", "Every transaction must be notarized", "It may be expressed orally, in writing or by specific conduct, subject to legally required formalities", "Electronic data messages can never count as writing"], "a": 2, "e": ""},
  {"id": "S8-04", "c": "S8-04", "t": "8. Civil law part 2", "q": "Which statement correctly distinguishes copyright from a general registration requirement?", "o": ["Every literary work must receive a patent before copyright exists", "Copyright always lasts for an unlimited period", "Copyright protects only company logos", "Copyright protection generally arises automatically for an eligible work, without mandatory registration to obtain protection"], "a": 3, "e": ""},
  {"id": "S8-05", "c": "S8-05", "t": "8. Civil law part 2", "q": "Which statement about a patent is most accurate?", "o": ["It provides time-limited exclusive protection for an invention that satisfies the applicable legal requirements", "It always lasts for the inventor’s lifetime", "It grants ownership of every idea in the same industry", "It gives protection only to a business name"], "a": 0, "e": ""},
  {"id": "S8-06", "c": "S8-06", "t": "8. Civil law part 2", "q": "What is the principal function of a trademark?", "o": ["To determine who inherits a deceased person’s property", "To distinguish the goods or services of one undertaking from those of others", "To record a marriage", "To protect every abstract scientific idea"], "a": 1, "e": ""},
  {"id": "S8-07", "c": "S8-07", "t": "8. Civil law part 2", "q": "Which statement best describes testamentary succession?", "o": ["Transfer of property only while the owner is alive", "Distribution that can never involve a written will", "Distribution of an estate under a legally effective will, subject to applicable legal limits", "Distribution decided solely by the employer of the deceased"], "a": 2, "e": ""},
  {"id": "S8-08", "c": "S8-08", "t": "8. Civil law part 2", "q": "Under Article 651 of Vietnam’s Civil Code, which group belongs to the first order of heirs at law?", "o": ["Only brothers and sisters", "Only the eldest son", "Only paternal and maternal grandparents", "The spouse, biological or adoptive parents, and biological or adopted children of the deceased"], "a": 3, "e": ""},
  {"id": "S8-09", "c": "S8-09", "t": "8. Civil law part 2", "q": "Which combination reflects the basic marriage principles?", "o": ["Voluntary marriage, monogamy and equality between spouses", "Polygamy and hereditary authority over a spouse", "Forced marriage and unequal rights between spouses", "Marriage imposed solely by an employer"], "a": 0, "e": ""},
  {"id": "S9-01", "c": "S9-01", "t": "9. Criminal law", "q": "Under the legality principle in Vietnam’s Criminal Code, criminal liability of an individual requires:", "o": ["Commission of an offence defined by the Criminal Code, with the applicable legal conditions satisfied", "Only that an official considers the conduct immoral", "A breach of any private workplace rule", "Only that the conduct is unpopular"], "a": 0, "e": ""},
  {"id": "S9-02", "c": "S9-02", "t": "9. Criminal law", "q": "Which feature is necessary in the statutory concept of a crime under Article 8?", "o": ["Any conduct that causes disappointment", "Socially dangerous conduct defined as an offence in the Criminal Code", "A disagreement between friends regardless of legal rules", "Any civil debt that remains unpaid"], "a": 1, "e": ""},
  {"id": "S9-03", "c": "S9-03", "t": "9. Criminal law", "q": "For the ordinary classification of a particular offence under Article 9, which penalty measure is used?", "o": ["The sentence that a newspaper predicts", "The minimum punishment requested by the victim", "The maximum penalty in the applicable statutory penalty bracket", "The amount of civil damages alone"], "a": 2, "e": ""},
  {"id": "S9-04", "c": "S9-04", "t": "9. Criminal law", "q": "An offence whose applicable statutory imprisonment bracket has a maximum of five years is ordinarily classified as:", "o": ["A less serious crime", "A very serious crime", "An extremely serious crime", "A serious crime"], "a": 3, "e": ""},
  {"id": "S9-05", "c": "S9-05", "t": "9. Criminal law", "q": "Subject to statutory exceptions and rules on recalculation, what is the ordinary limitation period for prosecution of a less serious crime?", "o": ["Five years", "Three years", "Ten years", "One year"], "a": 0, "e": ""},
  {"id": "S9-06", "c": "S9-06", "t": "9. Criminal law", "q": "Which description corresponds to direct intention under Article 10?", "o": ["The person cannot and need not foresee any harmful consequence", "The person foresees the harmful consequences and wants them to occur", "The person reasonably prevents all harm", "The act is purely involuntary and contains no fault"], "a": 1, "e": ""},
  {"id": "S9-07", "c": "S9-07", "t": "9. Criminal law", "q": "Which description corresponds to negligence through failure to foresee under Article 11?", "o": ["The person wants the harmful consequences", "The person foresees the harm and deliberately accepts it", "The person fails to foresee harmful consequences although they should and could have foreseen them", "The person has no legal duty or ability to foresee the event"], "a": 2, "e": ""},
  {"id": "S9-08", "c": "S9-08", "t": "9. Criminal law", "q": "Under Article 12, which statement about persons aged 14 to under 16 is correct?", "o": ["They bear liability for every offence without exception", "They can never bear criminal liability", "They bear liability only for administrative violations", "They may bear liability for the very serious or extremely serious offences specifically listed in that provision"], "a": 3, "e": ""},
  {"id": "S9-09", "c": "S9-09", "t": "9. Criminal law", "q": "Under Article 13, what is the general effect of losing awareness because of self-induced alcohol or strong-stimulant use when committing an offence?", "o": ["It does not by itself remove criminal liability", "It automatically converts the offence into a civil dispute", "It removes every possible punishment", "It automatically eliminates criminal liability"], "a": 0, "e": ""},
  {"id": "S9-10", "c": "S9-10", "t": "9. Criminal law", "q": "What distinguishes an attempted offence under Article 15?", "o": ["The person merely has an unexpressed thought", "Intentional execution is not completed for reasons outside the offender’s will", "The person completes every element of the offence", "The conduct is accidental and involves no intention"], "a": 1, "e": ""},
  {"id": "S9-11", "c": "S9-11", "t": "9. Criminal law", "q": "What is the effect of voluntary abandonment under Article 16?", "o": ["It always removes liability for every separate offence already committed", "It is legally identical to being stopped by the police", "It exempts liability for the intended offence, while a different completed offence may still attract liability", "It requires the intended offence to have been completed"], "a": 2, "e": ""},
  {"id": "S9-12", "c": "S9-12", "t": "9. Criminal law", "q": "Which element is required for complicity under Article 17?", "o": ["Two people independently cause unrelated losses", "Mere presence near an offence without participation", "A family relationship between all participants", "Two or more persons intentionally participate in committing the same crime"], "a": 3, "e": ""},
  {"id": "S9-13", "c": "S9-13", "t": "9. Criminal law", "q": "Which description best fits justifiable defence under Article 22?", "o": ["Necessary resistance to protect lawful interests against an ongoing unlawful infringement", "Any use of unlimited force against a suspected future threat", "Force used solely to punish a person for an earlier insult", "Any retaliation after the unlawful attack has ended"], "a": 0, "e": ""},
  {"id": "S9-14", "c": "S9-14", "t": "9. Criminal law", "q": "Which institution imposes criminal punishments under Article 30?", "o": ["The victim acting alone", "A court", "The offender’s employer", "A private legal consultant"], "a": 1, "e": ""},
  {"id": "S9-15", "c": "S9-15", "t": "9. Criminal law", "q": "Which statement about punishment for an individual offence is correct?", "o": ["A court must impose all available principal punishments together", "Additional punishments may never accompany imprisonment", "One principal punishment is imposed for an offence, and one or more additional punishments may also be imposed where legally applicable", "Every offender must receive the death penalty"], "a": 2, "e": ""},
  {"id": "S9-16", "c": "S9-16", "t": "9. Criminal law", "q": "Which statement correctly describes criminal liability of a commercial legal person in Vietnam?", "o": ["It automatically replaces the liability of every individual involved", "It applies to every civil breach committed by any organization", "It can be imposed only through a private contractual clause", "It applies to offences and conditions specified by the Criminal Code and does not exclude individual criminal liability"], "a": 3, "e": ""},
  {"id": "S9-17", "c": "S9-17", "t": "9. Criminal law", "q": "For an adult eligible for automatic conviction expungement under Article 70, who completed a prison sentence of up to five years, what is the ordinary waiting period if all other statutory conditions are met?", "o": ["Two years", "Three years", "Seven years", "One year"], "a": 0, "e": ""},
  {"id": "S10-01", "c": "S10-01", "t": "10. Labor law", "q": "Which feature is central to identifying an employment relationship under the Labour Code?", "o": ["Paid work under the management, direction or supervision of an employer", "A written promise to perform unpaid voluntary work only", "Any purchase of goods from a shop", "Every independent sale made by a business"], "a": 0, "e": ""},
  {"id": "S10-02", "c": "S10-02", "t": "10. Labor law", "q": "Which practice is prohibited under Article 8 of the Labour Code?", "o": ["Paying the agreed salary on time", "Sexual harassment in the workplace", "Providing safety equipment", "Agreeing lawful working conditions"], "a": 1, "e": ""},
  {"id": "S10-03", "c": "S10-03", "t": "10. Labor law", "q": "Which statement about employment contracts expressed as electronic data messages is correct?", "o": ["They are necessarily invalid", "They are valid only if never stored electronically", "They can have the same value as written contracts when electronic-transaction requirements are met", "They have legal value only after conversion into handwriting"], "a": 2, "e": ""},
  {"id": "S10-04", "c": "S10-04", "t": "10. Labor law", "q": "Which employer demand is expressly prohibited when concluding or performing an employment contract?", "o": ["Requesting information lawfully needed for recruitment", "Providing the employee with a copy of the contract", "Explaining the agreed working conditions", "Requiring a cash or property deposit as security for performance"], "a": 3, "e": ""},
  {"id": "S10-05", "c": "S10-05", "t": "10. Labor law", "q": "Who ordinarily signs an employment contract on behalf of an enterprise employer?", "o": ["Its legal representative or a person lawfully authorized to do so", "Any customer of the enterprise", "Only the employee’s family representative", "Any employee without authorization"], "a": 0, "e": ""},
  {"id": "S10-06", "c": "S10-06", "t": "10. Labor law", "q": "May a person authorized to conclude an employment contract re-authorize another person to sign it under Article 18?", "o": ["Yes, whenever convenient", "No, the authorized person may not re-authorize another person", "Yes, if the second person is a colleague", "Only if the employee has not read the contract"], "a": 1, "e": ""},
  {"id": "S10-07", "c": "S10-07", "t": "10. Labor law", "q": "Under Article 19, when may an employee conclude contracts with more than one employer?", "o": ["Only when all jobs are unpaid", "Only if none of the employers keeps records", "When the employee fully performs the terms of the contracts concluded", "Only if the employee has no main occupation"], "a": 2, "e": ""},
  {"id": "S10-08", "c": "S10-08", "t": "10. Labor law", "q": "For the same job, how many probationary periods are permitted under Article 25?", "o": ["An unlimited number if the employer changes the contract title", "Two automatically", "One each calendar year", "Only one"], "a": 3, "e": ""},
  {"id": "S10-09", "c": "S10-09", "t": "10. Labor law", "q": "For a non-managerial position requiring a college degree or higher, what is the maximum probationary period under Article 25?", "o": ["Sixty days", "Six working days", "One hundred and eighty days", "An unlimited period agreed by the employer"], "a": 0, "e": ""},
  {"id": "S10-10", "c": "S10-10", "t": "10. Labor law", "q": "What is the minimum probationary salary under Article 26?", "o": ["50% of the salary for the job", "85% of the salary for the job", "70% of the salary for the job", "100% of the employer’s average wage"], "a": 1, "e": ""},
  {"id": "S10-11", "c": "S10-11", "t": "10. Labor law", "q": "For an ordinary job under an indefinite-term contract, what prior notice must an employee normally give when resigning without a statutory exception?", "o": ["Three working days", "Ten calendar days", "At least forty-five days", "Thirty days"], "a": 2, "e": ""},
  {"id": "S10-12", "c": "S10-12", "t": "10. Labor law", "q": "Which circumstance gives an employee a right to terminate without prior notice under Article 35?", "o": ["A preference for a different commuting route", "A wish to change jobs with no other reason", "An ordinary disagreement over a lawful staff meeting", "Sexual harassment in the workplace"], "a": 3, "e": ""},
  {"id": "S10-13", "c": "S10-13", "t": "10. Labor law", "q": "Which absence may permit employer termination without prior notice under Article 36, assuming all statutory conditions are satisfied?", "o": ["At least five consecutive working days of absence without a legitimate reason", "Any one-day absence approved by the employer", "Any period of statutory maternity leave", "Two hours of lateness during a month"], "a": 0, "e": ""},
  {"id": "S10-14", "c": "S10-14", "t": "10. Labor law", "q": "Under Article 98, what minimum rate applies to overtime work on an employee’s weekly day off, excluding any night-work additions?", "o": ["100% of the applicable normal wage rate", "200% of the applicable normal wage rate", "150% of the applicable normal wage rate", "300% in every situation"], "a": 1, "e": ""},
  {"id": "S10-15", "c": "S10-15", "t": "10. Labor law", "q": "Under Article 98, what minimum additional payment applies to ordinary night work, excluding overtime additions?", "o": ["5% of the applicable normal daytime wage rate", "10% of that rate", "30% of that rate", "20% of that rate"], "a": 2, "e": ""},
  {"id": "S10-16", "c": "S10-16", "t": "10. Labor law", "q": "Which paid personal leave entitlement applies when an employee’s biological or adopted child marries, after notification to the employer?", "o": ["One month", "Three days", "Five days", "One day"], "a": 3, "e": ""},
  {"id": "S10-17", "c": "S10-17", "t": "10. Labor law", "q": "Under Article 151, what is the minimum age for a foreign employee working in Vietnam?", "o": ["Eighteen", "Fifteen", "Sixteen", "Twenty-one"], "a": 0, "e": ""},
  {"id": "LC-01", "c": "LC-01", "t": "10. Labor law cases", "q": "H signs a quarry employment contract. At the site, she discovers a direct threat to her life or health. The employer insists that her signature requires her to work. Which answer is correct?", "o": ["She must work because she accepted the contract", "She may refuse the work because of the direct threat to her life or health", "She may refuse only after paying the employer a deposit", "She has this right only because she is a woman"], "a": 1, "e": ""},
  {"id": "LC-02", "c": "LC-02", "t": "10. Labor law cases", "q": "A supervisor repeatedly directs unwanted sexual remarks at an employee at work. The employee does not welcome or accept this conduct. Which rule is most directly relevant?", "o": ["The prohibition of sexual harassment in the workplace", "The requirement to pay a deposit before employment", "The automatic extension of probation", "The rule that all overtime is unpaid"], "a": 0, "e": ""},
  {"id": "LC-03", "c": "LC-03", "t": "10. Labor law cases", "q": "Nam works for wages under the shop owner’s supervision. Their document is called a work agreement. After an illness-related absence, the owner withholds wages already earned solely as a disciplinary fine. Which statement is correct?", "o": ["The document title excludes every employment protection", "Unexpected absence always permits forfeiture of all earned wages", "The relationship may be an employment contract, and withholding wages as a disciplinary fine is prohibited", "Part-time workers cannot be employees"], "a": 2, "e": ""},
  {"id": "LC-04", "c": "LC-04", "t": "10. Labor law cases", "q": "A company and an employee conclude their employment contract through an electronic data message that satisfies the applicable electronic-transaction rules. The employer later says it has no legal value because it is not on paper. Which answer is correct?", "o": ["It has no legal value in all cases", "It is effective only if converted into a handwritten document", "It is merely a social promise", "It can have the same value as a written employment contract"], "a": 3, "e": ""},
  {"id": "LC-05", "c": "LC-05", "t": "10. Labor law cases", "q": "Huong hires a cashier and demands to keep the employee’s original identity card throughout employment as security against cash shortages. Is this permitted?", "o": ["No, retaining the employee’s original identity documents is prohibited", "Yes, whenever the employer handles cash", "Yes, if the employer promises to return it after five years", "Only if the employee also provides a cash deposit"], "a": 0, "e": ""},
  {"id": "LC-06", "c": "LC-06", "t": "10. Labor law cases", "q": "A group of workers, all aged at least 18, takes an eight-month seasonal job. They authorize one worker in the group to sign a written employment contract, with the required list of workers attached. Which statement is correct?", "o": ["The representative may freely authorize any outsider to sign instead", "The contract may be effective as if concluded with each worker, subject to the statutory requirements", "Group authorization is never permitted", "A group contract eliminates each worker’s employment rights"], "a": 1, "e": ""},
  {"id": "LC-07", "c": "LC-07", "t": "10. Labor law cases", "q": "Lan works as an accountant for H and signs additional employment contracts with two smaller businesses. She can fully perform all three contracts. Is having several employers prohibited merely because she already works for H?", "o": ["Yes, a worker may have only one employer in all cases", "Yes, unless every additional job is unpaid", "No, multiple employment contracts are permitted if she fully performs them", "No, and she is automatically exempt from every insurance obligation"], "a": 2, "e": ""},
  {"id": "LC-08", "c": "LC-08", "t": "10. Labor law cases", "q": "Hoa takes a non-managerial job requiring a university degree. Her agreed probation is 60 days, with pay equal to 70% of the salary for that job. Which change is needed to meet Article 26?", "o": ["Reduce her pay to 50%", "Replace all pay with a training certificate", "Extend probation to six months", "Raise probationary pay to at least 85% of the salary for the job"], "a": 3, "e": ""},
  {"id": "LC-09", "c": "LC-09", "t": "10. Labor law cases", "q": "An employee receives one month of unpaid leave to care for an ill mother. Before it ends, the employer expressly approves ten additional days. During those approved days, it terminates the contract solely for unauthorized absence. Which statement is correct?", "o": ["The stated ground is not justified because the additional leave was approved", "Every absence longer than one month is automatically unauthorized", "Approval is legally irrelevant once the mother remains ill", "The employer may always terminate immediately during approved leave"], "a": 0, "e": ""},
  {"id": "LC-10", "c": "LC-10", "t": "10. Labor law cases", "q": "An employee is sexually harassed in the workplace and wishes to leave immediately. Under Article 35, must the employee give the ordinary resignation notice?", "o": ["Yes, in every case", "No, this is a statutory ground for termination without prior notice", "Only a manager may leave without notice", "The employee must first complete another probationary period"], "a": 1, "e": ""},
  {"id": "LC-11", "c": "LC-11", "t": "10. Labor law cases", "q": "An employee repeatedly fails to meet performance criteria in a lawfully issued assessment regulation. The employer consulted the workplace employee representative organization where required. Assuming notice and other legal requirements are met, which answer is correct?", "o": ["Poor performance can never be a legal ground for termination", "A manager’s undocumented dislike is enough in every case", "Repeated failure under the lawful criteria can be a ground for employer termination", "The employer must treat the employee as having resigned voluntarily"], "a": 2, "e": ""},
  {"id": "LC-12", "c": "LC-12", "t": "10. Labor law cases", "q": "B has an indefinite-term contract for an ordinary job. After 13 consecutive months of treatment following an accident, he remains unable to work. X relies on this statutory medical ground to terminate. What minimum prior notice applies under Article 36(2)(c), assuming no special occupation rule?", "o": ["No notice in every medical case", "Thirty calendar days", "Forty-five days solely because the contract is indefinite", "At least three working days"], "a": 3, "e": ""},
  {"id": "LC-13", "c": "LC-13", "t": "10. Labor law cases", "q": "An hourly-paid employee lawfully works two overtime hours in daytime on a normal working day. The applicable ordinary hourly wage is VND 100,000. What is the statutory minimum pay for those two overtime hours alone?", "o": ["VND 300,000", "VND 200,000", "VND 250,000", "VND 600,000"], "a": 0, "e": ""},
  {"id": "LC-14", "c": "LC-14", "t": "10. Labor law cases", "q": "An employee notifies the employer of the employee’s own marriage. Under Article 115, what paid personal leave is the employee entitled to?", "o": ["One day", "Three days", "Ten days", "Only unpaid leave"], "a": 1, "e": ""},
  {"id": "LC-15", "c": "LC-15", "t": "10. Labor law cases", "q": "An employer refuses a qualified female employee access to professional training solely because she is a woman. There is no job-specific legal requirement justifying the distinction. Which principle is most directly violated?", "o": ["The right to require an employment deposit", "The employer’s unlimited discretion to discriminate", "Gender equality and the prohibition of labour discrimination", "The rule that all training must be unpaid"], "a": 2, "e": ""},
  {"id": "LC-16", "c": "LC-16", "t": "10. Labor law cases", "q": "A foreign applicant is qualified, healthy and has full legal capacity. The employer says a work permit is unnecessary simply because the applicant is a foreign expert. No statutory exemption applies. Which answer is correct?", "o": ["Expert status always eliminates the permit requirement", "Only the employee’s verbal promise is required", "A foreign passport substitutes for every work authorization", "A work permit is required unless a lawful exemption applies"], "a": 3, "e": ""},
