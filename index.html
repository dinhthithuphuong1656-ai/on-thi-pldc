/* ---------- storage ---------- */
function loadLocal(){ try{ const raw = localStorage.getItem(LS_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; } }
function saveLocal(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(state)); }catch(e){} }
function validQ(q){ return q && typeof q.id==='string' && typeof q.q==='string' && Array.isArray(q.o) && q.o.length>=2 && q.o.every(x=>typeof x==='string') && Number.isInteger(q.a) && q.a>=0 && q.a<q.o.length; }
function normalize(s){
  s = (s && typeof s==='object') ? s : {};
  const custom = Array.isArray(s.custom) ? s.custom.filter(validQ).map(q=>({id:q.id,t:typeof q.t==='string'&&q.t?q.t:CUSTOM_TOPIC,q:q.q,o:q.o.slice(),a:q.a,e:typeof q.e==='string'?q.e:''})) : [];
  const stats = {};
  if(s.stats && typeof s.stats==='object'){ for(const k of Object.keys(s.stats)){ const v=s.stats[k]; if(v&&typeof v==='object') stats[k]={r:+v.r||0,w:+v.w||0,s:+v.s||0,t:+v.t||0}; } }
  const p = (s.prefs && typeof s.prefs==='object') ? s.prefs : {};
  return { stats, custom, topics: Array.isArray(s.topics) ? s.topics.filter(x=>typeof x==='string') : [], prefs:{ timer: p.timer !== false, sound: p.sound !== false }, updatedAt: Number(s.updatedAt)||0 };
}
function persist(){ state.updatedAt = Date.now(); saveLocal(); dirty = true; scheduleFlush(); }
function scheduleFlush(){ clearTimeout(flushTimer); flushTimer = setTimeout(flush, 1500); }
async function flush(){
  if(!docRef || saving || !dirty) return;
  saving = true; dirty = false;
  try{ await docRef.set(JSON.parse(JSON.stringify(state))); retried = false; setSync('cloud'); }
  catch(e){
    const code = e && e.code;
    if(code==='unavailable' && !retried){ retried = true; dirty = true; saving = false; setTimeout(flush, 1500 + Math.random()*1500); return; }
    retried = false;
    if(code==='quota_exceeded') setSync('full');
    else{ setSync('error'); if(['invalid_argument','revoked','not_granted','capability_disabled','capability_removed','transform_error'].includes(code)) docRef = null; }
  }
  saving = false;
  if(dirty) scheduleFlush();
}
function setSync(mode){ syncMode = mode; const el = document.getElementById('syncNote'); if(el) el.textContent = SYNC_TEXT[mode]; }
function withTimeout(p, ms){ return Promise.race([p, new Promise((_,rej)=>setTimeout(()=>rej({code:'timeout'}), ms))]); }
async function initCloud(){
  if(!(window.claude && typeof window.claude.use === 'function')){ setSync('local'); return; }
  try{
    const [dbNs, userNs] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!dbNs || !userNs){ setSync('local'); return; }
    const id = await userNs.id();
    if(!id){ setSync('local'); return; }
    const ref = dbNs.doc('data/users/' + id + '/progress');
    const snap = await withTimeout(ref.get(), 10000);
    docRef = ref;
    if(snap.exists){
      const remote = normalize(JSON.parse(JSON.stringify(snap.data())));
      if(remote.updatedAt > state.updatedAt){ state = remote; saveLocal(); if(!session) renderHome(); }
      else if(state.updatedAt > remote.updatedAt){ dirty = true; flush(); }
    }else if(state.updatedAt > 0){ dirty = true; flush(); }
    setSync('cloud');
  }catch(e){ setSync(docRef ? 'error' : 'local'); }
}
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='hidden' && dirty){ clearTimeout(flushTimer); flush(); } });

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function fmt(sec){ sec=Math.max(0,Math.round(sec)); const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
function num(n){ return Math.round(n).toLocaleString('vi-VN'); }
function pickOne(a){ return a[Math.floor(Math.random()*a.length)]; }
function allQuestions(){ return BANK.concat(state.custom); }
function chapterList(){
  const list = CHAPTERS.slice();
  for(const q of state.custom){ if(!list.some(c=>c.t===q.t)) list.push({t:q.t, no:'✎', name:q.t, vi:'Câu hỏi bạn tự thêm', ico:'✏️'}); }
  return list.filter(c=>allQuestions().some(q=>q.t===c.t));
}
function chapterOf(t){ return chapterList().find(c=>c.t===t) || {t, no:'', name:t, vi:'', ico:'📝'}; }
function statusOf(id){ const s = state.stats[id]; if(!s || (s.r+s.w)===0) return 'new'; if(s.s>=2) return 'mastered'; if(s.s===0) return 'weak'; return 'learning'; }
function record(id, ok){ const s = state.stats[id] || {r:0,w:0,s:0,t:0}; if(ok){ s.r++; s.s++; } else { s.w++; s.s=0; } s.t = Date.now(); state.stats[id] = s; }
function makeItem(q){ return { q, order: shuffle(q.o.map((_,k)=>k)), picked: null }; }
function qTime(q){ return (q.c && q.c.startsWith('LC')) ? 60 : 30; }
function needsConfirm(el, key, label){
  if(armed && armed.key===key && Date.now() < armed.until){ armed = null; return false; }
  if(!el.dataset.orig) el.dataset.orig = el.textContent;
  armed = { key, until: Date.now() + 4000 };
  el.textContent = label; el.classList.add('armed');
  setTimeout(()=>{ if(el.isConnected && armed && armed.key===key && Date.now() >= armed.until - 50){ el.textContent = el.dataset.orig; el.classList.remove('armed'); armed = null; } }, 4000);
  return true;
}

/* ---------- sound & confetti ---------- */
let actx = null;
function sound(type){
  if(!state.prefs.sound) return;
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const now = actx.currentTime;
    const seq = type==='ok' ? [[880,0],[1318.5,.09]] : type==='no' ? [[330,0],[247,.13]] : type==='win' ? [[784,0],[988,.1],[1318.5,.2]] : [[660,0]];
    seq.forEach(([f,t])=>{
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = type==='no' ? 'triangle' : 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, now+t); g.gain.exponentialRampToValueAtTime(.16, now+t+.02); g.gain.exponentialRampToValueAtTime(.0001, now+t+.24);
      o.connect(g); g.connect(actx.destination); o.start(now+t); o.stop(now+t+.26);
    });
  }catch(e){}
}
function confetti(rect, n){
  if(REDUCE_MOTION || !rect) return;
  const colors = ['#FF8FBF','#79BDEE','#7ED59E','#EEC45A','#A98BF5'];
  for(let i=0;i<(n||16);i++){
    const s = document.createElement('i'); s.className = 'conf';
    s.style.left = (rect.left + rect.width/2) + 'px'; s.style.top = (rect.top + rect.height/2) + 'px';
    s.style.background = colors[i % colors.length];
    const ang = Math.random()*Math.PI*2, d = 60 + Math.random()*100;
    s.style.setProperty('--dx', (Math.cos(ang)*d) + 'px'); s.style.setProperty('--dy', (Math.sin(ang)*d - 50) + 'px'); s.style.setProperty('--r', (Math.random()*600-300) + 'deg');
    document.body.appendChild(s); setTimeout(()=>s.remove(), 950);
  }
}

/* ---------- sessions ---------- */
function startPlay(questions, title, key){
  stopTimers();
  session = { mode:'play', title, key, items: shuffle(questions).map(makeItem), i:0, score:0, streak:0, best:0, done:false };
  showQuestion();
}
function startExam(){
  stopTimers();
  const qs = shuffle(allQuestions()).slice(0, EXAM_N);
  session = { mode:'exam', title:'Thi thử', items: qs.map(makeItem), i:0, done:false, startedAt: Date.now(), endsAt: Date.now() + qs.length*EXAM_SEC_PER_Q*1000 };
  renderGame(true);
  examTimerId = setInterval(examTick, 500);
}
function cur(){ return session.items[session.i]; }
function showQuestion(){ renderGame(true); startQTimer(); }
function startQTimer(){
  if(qTimerId){ clearInterval(qTimerId); qTimerId = null; }
  if(!session || session.mode!=='play' || !state.prefs.timer) return;
  const it = cur(); it.start = Date.now(); it.dur = qTime(it.q);
  qTimerId = setInterval(()=>{
    if(!session || session.mode!=='play'){ clearInterval(qTimerId); qTimerId = null; return; }
    const rem = Math.max(0, it.dur - (Date.now()-it.start)/1000);
    const fill = document.getElementById('tfill'), nEl = document.getElementById('tnum'), bar = document.getElementById('tbar');
    if(fill) fill.style.width = (rem/it.dur*100) + '%';
    if(nEl) nEl.textContent = Math.ceil(rem);
    if(bar) bar.classList.toggle('low', rem <= 5);
    if(rem <= 0){ clearInterval(qTimerId); qTimerId = null; answer(-1); }
  }, 100);
}
function examTick(){
  if(!session || session.mode!=='exam' || session.done){ clearInterval(examTimerId); examTimerId = null; return; }
  const rem = (session.endsAt - Date.now())/1000;
  const el = document.getElementById('examTimer');
  if(el){ el.textContent = '⏱ ' + fmt(rem); el.classList.toggle('hot', rem <= 60); }
  if(rem <= 0) submitExam();
}

function renderGame(focusQ){
  const s = session, it = cur(), q = it.q, N = s.items.length;
  const play = s.mode==='play';
  const answered = play && it.picked !== null;
  const ch = chapterOf(q.t);
  const doneCount = s.items.filter(x=>x.picked!==null).length;
  const tiles = it.order.map((orig,k)=>{
    let cls = `tile t${k%4}`, mark = '';
    if(answered){
      if(orig===q.a){ cls += ' is-correct'; mark = '<span class="mark" aria-hidden="true">✓</span><span class="sr"> (đáp án đúng)</span>'; }
      else if(orig===it.picked){ cls += ' is-wrong'; mark = '<span class="mark" aria-hidden="true">✕</span><span class="sr"> (bạn chọn)</span>'; }
      else cls += ' is-dim';
    }else if(!play && it.picked===orig){ cls += ' is-picked'; }
    const pressed = play ? '' : ` aria-pressed="${it.picked===orig}"`;
    return `<button class="${cls}" data-act="pick" data-k="${k}"${pressed} ${answered?'disabled':''}><span class="tl">${LETTERS[k]}</span><span lang="en">${esc(q.o[orig])}</span>${mark}</button>`;
  }).join('');

  let top;
  if(play){
    top = `<span class="pill">Câu ${s.i+1}/${N}</span><span class="spacer"></span>
      <span class="pill ${s.streak>=2?'hot':''}" aria-label="Chuỗi đúng liên tiếp">🔥 ${s.streak}</span>
      <span class="pill" aria-label="Điểm">⭐ ${num(s.score)}</span>`;
  }else{
    top = `<span class="pill">Câu ${s.i+1}/${N}</span><span class="spacer"></span>
      <span class="pill" id="examTimer" aria-label="Thời gian còn lại">⏱ ${fmt((s.endsAt-Date.now())/1000)}</span>`;
  }
  let timerBar = '';
  if(play && state.prefs.timer && !answered){
    const dur = it.dur || qTime(q), rem = it.start ? Math.max(0, dur - (Date.now()-it.start)/1000) : dur;
    timerBar = `<div class="tbar" id="tbar" aria-hidden="true"><span class="track"><span class="fill" id="tfill" style="width:${(rem/dur*100).toFixed(1)}%"></span></span><b id="tnum">${Math.ceil(rem)}</b></div>`;
  }

  let below = '';
  if(answered){
    const ok = it.picked === q.a;
    below = `<div class="feedback ${ok?'ok':'no'}" role="status">
      <div class="fb-in">
        ${mascot(ok?'happy':'sad', 58)}
        <div class="fb-text">
          <p class="fb-title">${esc(it.msg)}</p>
          <p class="fb-sub">${ok ? `+${num(it.points)} điểm${s.streak>=2 ? `, chuỗi ${s.streak} câu 🔥` : ''}` : `Đáp án đúng là ${LETTERS[it.order.indexOf(q.a)]}.`}</p>
        </div>
        <button class="btn primary" data-act="next" id="nextBtn">${s.i===N-1 ? 'Xem kết quả 🎀' : 'Tiếp tục ➜'}</button>
      </div>
    </div>`;
  }else if(play){
    below = `<p class="hint kbd">Phím 1–4 hoặc A–D để chọn, Enter để sang câu tiếp.</p>`;
  }else{
    below = `<div class="exam-nav"><button class="btn soft" data-act="prev" ${s.i===0?'disabled':''}>◀ Câu trước</button><button class="btn soft" data-act="next" ${s.i===N-1?'disabled':''}>Câu sau ▶</button></div>
      <div class="dots" aria-label="Danh sách câu">${s.items.map((x,j)=>`<button class="dot ${x.picked!==null?'done':''} ${j===s.i?'cur':''}" data-act="jump" data-i="${j}" aria-label="Câu ${j+1}${x.picked!==null?', đã trả lời':''}"${j===s.i?' aria-current="true"':''}>${j+1}</button>`).join('')}</div>
      <div class="submit-row"><button class="btn primary" data-act="submit">Nộp bài (${doneCount}/${N} câu đã làm)</button></div>
      <p class="hint kbd">Phím 1–4 để chọn, mũi tên trái/phải để chuyển câu.</p>`;
  }

  app.innerHTML = `<div class="game ${answered?'answered':''}">
    <div class="topbar">
      <button class="icon-btn" data-act="exit" aria-label="${play ? 'Về trang chính' : 'Thoát bài thi'}">✕</button>
      ${top}
      <button class="icon-btn" data-act="sound-quick" aria-label="${state.prefs.sound ? 'Tắt âm thanh' : 'Bật âm thanh'}">${state.prefs.sound ? '🔊' : '🔇'}</button>
    </div>
    ${timerBar}
    <section class="qcard">
      <div class="qhead">${mascot(answered ? (it.picked===q.a ? 'happy' : 'sad') : 'idle', 34)}<span class="qtopic" lang="en">${esc(ch.name)}${q.c ? ` (${esc(q.c)})` : ''}</span></div>
      <h2 class="qtext ${q.q.length > 160 ? 'long' : ''}" id="qtext" tabindex="-1" lang="en">${esc(q.q)}</h2>
    </section>
    <div class="tiles" role="group" aria-labelledby="qtext">${tiles}</div>
    ${below}
  </div>`;
  if(focusQ){ window.scrollTo(0,0); const h = document.getElementById('qtext'); if(h) h.focus({preventScroll:true}); }
}

function answer(k){
  const s = session; if(!s || s.done) return;
  const it = cur();
  if(s.mode==='exam'){
    if(k<0 || k>=it.order.length) return;
    it.picked = it.order[k]; renderGame(false);
    const b = app.querySelector(`[data-act="pick"][data-k="${k}"]`); if(b) b.focus();
    return;
  }
  if(it.picked !== null) return;
  if(qTimerId){ clearInterval(qTimerId); qTimerId = null; }
  const tileEl = k>=0 ? app.querySelector(`[data-act="pick"][data-k="${k}"]`) : null;
  const rect = tileEl ? tileEl.getBoundingClientRect() : null;
  const timedOut = k < 0;
  it.picked = timedOut ? -1 : it.order[k];
  const ok = it.picked === it.q.a;
  if(ok){
    s.streak++; s.best = Math.max(s.best, s.streak);
    let pts;
    if(state.prefs.timer && it.start){ const frac = Math.max(0, 1 - (Date.now()-it.start)/1000/(it.dur||30)); pts = 500 + Math.round(500*frac); }
    else pts = 800;
    pts += Math.min(s.streak-1, 5) * 100;
    it.points = pts; s.score += pts;
    it.msg = pickOne(['Đúng rồi! 🎉','Giỏi quá đi! 💖','Chuẩn luôn! ✨','Siêu ghê! 🌟','Quá đỉnh! 🍓']);
  }else{
    s.streak = 0; it.points = 0;
    it.msg = timedOut ? 'Hết giờ mất rồi! ⏰' : pickOne(['Tiếc quá à! 🥺','Sai mất rồi! 😿','Hụt chút xíu! 🫣']);
  }
  record(it.q.id, ok); persist();
  renderGame(false);
  if(ok){ sound('ok'); confetti(rect, 18); } else sound('no');
  const nb = document.getElementById('nextBtn'); if(nb) nb.focus({preventScroll:true});
}
function next(){
  const s = session; if(!s || s.done) return;
  if(s.mode==='exam'){ if(s.i < s.items.length-1){ s.i++; renderGame(true); } return; }
  if(cur().picked === null) return;
  if(s.i < s.items.length-1){ s.i++; showQuestion(); }
  else finish();
}
function prev(){ const s = session; if(s && s.mode==='exam' && !s.done && s.i>0){ s.i--; renderGame(true); } }
function submitExam(){
  const s = session; if(!s || s.mode!=='exam' || s.done) return;
  s.used = Math.min((Date.now()-s.startedAt)/1000, (s.endsAt-s.startedAt)/1000);
  s.items.forEach(it=>record(it.q.id, it.picked===it.q.a));
  persist(); finish();
}
function finish(){ stopTimers(); session.done = true; renderResults(); }

/* ---------- results ---------- */
function reviewItem(it){
  const q = it.q, ok = it.picked === q.a;
  const yours = (it.picked === null || it.picked < 0) ? (it.picked === -1 ? 'Hết giờ, chưa chọn' : 'Chưa trả lời') : q.o[it.picked];
  return `<article class="rev">
    ${q.c ? `<p class="rev-code">${esc(q.c)}</p>` : ''}
    <p class="rev-q" lang="en">${esc(q.q)}</p>
    ${ok ? `<p class="rev-a ok">✓ <span lang="en">${esc(q.o[q.a])}</span></p>`
         : `<p class="rev-a no">✕ Bạn chọn: <span lang="en">${esc(yours)}</span></p><p class="rev-a ok">✓ Đáp án đúng: <span lang="en">${esc(q.o[q.a])}</span></p>${q.e ? `<p class="hint" lang="en">${esc(q.e)}</p>` : ''}`}
  </article>`;
}
function renderResults(){
  const s = session, items = s.items, N = items.length;
  const right = items.filter(it=>it.picked===it.q.a), wrong = items.filter(it=>it.picked!==it.q.a);
  const pct = Math.round(right.length/N*100);
  const stars = pct>=90 ? 3 : pct>=70 ? 2 : pct>=40 ? 1 : 0;
  const cheer = ['Không sao đâu, mình cùng ôn lại từ từ nha 🫶','Cố lên nha! Xem lại các câu sai rồi chơi lại nhé 🌱','Giỏi lắm! Ôn thêm mấy câu sai là chuẩn bài luôn ✨','Xuất sắc! Bé Mèo tự hào về bạn lắm 💖'][stars];
  const isPlay = s.mode==='play';
  app.innerHTML = `
  <section class="result">
    ${mascot(stars>=2 ? 'happy' : stars===1 ? 'idle' : 'sad', 120)}
    <p class="stars" aria-label="${stars} trên 3 sao">${'<span>★</span>'.repeat(stars)}${'<span class="off">★</span>'.repeat(3-stars)}</p>
    <p class="r-score">${isPlay ? `${num(s.score)} điểm` : `${right.length}/${N}`}</p>
    <p class="r-sub">${esc(s.title)}: đúng ${right.length}/${N} câu (${pct}%). ${cheer}</p>
    <div class="r-pills">
      <span class="pill">✅ ${right.length} đúng</span><span class="pill">❌ ${wrong.length} sai</span>
      ${isPlay ? `<span class="pill">🔥 Chuỗi dài nhất ${s.best}</span>` : `<span class="pill">⏱ ${fmt(s.used)}</span>`}
    </div>
    <div class="r-actions">
      ${wrong.length ? `<button class="btn primary" data-act="retry">Chơi lại ${wrong.length} câu sai</button>` : ''}
      ${isPlay ? `<button class="btn ${wrong.length?'soft':'primary'}" data-act="again">Chơi lại từ đầu</button>` : `<button class="btn ${wrong.length?'soft':'primary'}" data-act="exam">Thi thử lượt mới</button>`}
      <button class="btn soft" data-act="home">Về trang chính</button>
    </div>
  </section>
  ${wrong.length ? `<section class="review"><h2>Các câu cần xem lại 📌</h2>${wrong.map(reviewItem).join('')}</section>` : ''}
  ${right.length ? `<details class="review-right"><summary>Xem ${right.length} câu trả lời đúng</summary>${right.map(reviewItem).join('')}</details>` : ''}`;
  window.scrollTo(0,0);
  if(stars>=2){ sound('win'); const sc = app.querySelector('.r-score'); if(sc) confetti(sc.getBoundingClientRect(), 30); }
}

/* ---------- custom questions ---------- */
function parseCustom(text){
  const blocks = text.replace(/\r/g,'').split(/\n[ \t]*\n+/).map(b=>b.trim()).filter(Boolean);
  const qs = [], errs = [];
  const names = chapterList().map(c=>c.t);
  blocks.forEach((b, bi)=>{
    const lines = b.split('\n').map(l=>l.trim()).filter(Boolean);
    const qLines = [], opts = []; let ans = null, star = null, ex = '', topic = '', inEx = false;
    for(const line of lines){
      let m;
      if((m = line.match(/^(?:answer|ans|key|đáp án|dap an)\s*[:：\-–]\s*\(?([A-Fa-f])\)?/i))){ ans = LETTERS.indexOf(m[1].toUpperCase()); inEx=false; continue; }
      if((m = line.match(/^(?:explain|explanation|giải thích|giai thich)\s*[:：\-–]\s*(.*)$/i))){ ex = m[1]; inEx = true; continue; }
      if((m = line.match(/^(?:topic|chủ đề|chu de)\s*[:：\-–]\s*(.*)$/i))){ topic = m[1].trim(); inEx=false; continue; }
      if((m = line.match(/^(\*)?\s*\(?([A-Fa-f])\s*[\.\):]\s+(.+)$/))){
        const idx = LETTERS.indexOf(m[2].toUpperCase());
        if(idx === opts.length){
          let txt = m[3].trim();
          if(/\s*\*$/.test(txt)){ txt = txt.replace(/\s*\*$/,''); star = idx; }
          if(m[1]) star = idx;
          opts.push(txt); inEx=false; continue;
        }
      }
      if(inEx) ex += ' ' + line;
      else if(opts.length === 0) qLines.push(line.replace(/^(?:q|question|câu(?:\s*hỏi)?)\s*\d*\s*[:：\.\)]\s*/i,'').replace(/^\d+\s*[\.\):]\s+/,''));
      else opts[opts.length-1] += ' ' + line;
    }
    const label = `Câu ${bi+1}:`;
    const qText = qLines.join(' ').trim();
    if(ans === null && star !== null) ans = star;
    if(!qText){ errs.push(`${label} thiếu nội dung câu hỏi.`); return; }
    if(opts.length < 2){ errs.push(`${label} cần ít nhất 2 lựa chọn (A., B., …).`); return; }
    if(ans === null || ans < 0){ errs.push(`${label} thiếu đáp án (thêm dòng “Answer: B”).`); return; }
    if(ans >= opts.length){ errs.push(`${label} đáp án ${LETTERS[ans]} không có trong các lựa chọn.`); return; }
    const match = topic && names.find(t=>t.toLowerCase()===topic.toLowerCase());
    qs.push({ id:'c'+Date.now().toString(36)+'_'+bi+'_'+Math.random().toString(36).slice(2,6), t: match || topic || CUSTOM_TOPIC, q:qText, o:opts, a:ans, e:ex.trim() });
  });
  return { qs, errs };
}
function addCustom(){
  const ta = document.getElementById('customInput'), msg = document.getElementById('customMsg');
  const text = ta.value;
  if(!text.trim()){ msg.textContent = 'Dán ít nhất một câu hỏi vào ô trên.'; msg.className = 'msg err'; return; }
  const { qs, errs } = parseCustom(text);
  const seen = new Set(allQuestions().map(q=>q.q.trim().toLowerCase()));
  const fresh = []; let dup = 0;
  qs.forEach(q=>{ const k = q.q.trim().toLowerCase(); if(seen.has(k)){ dup++; return; } seen.add(k); fresh.push(q); });
  if(state.custom.length + fresh.length > MAX_CUSTOM){ msg.textContent = `Tối đa ${MAX_CUSTOM} câu tự thêm. Hiện đã có ${state.custom.length} câu.`; msg.className = 'msg err'; return; }
  let out = fresh.length ? `Đã thêm ${fresh.length} câu.` : 'Chưa thêm được câu nào.';
  if(dup) out += ` Bỏ qua ${dup} câu trùng.`;
  if(errs.length) out += ' ' + errs.slice(0,3).join(' ') + (errs.length>3 ? ` Còn ${errs.length-3} lỗi khác.` : '');
  if(!fresh.length){ msg.textContent = out; msg.className = 'msg err'; return; }
  state.custom = state.custom.concat(fresh); persist();
  customOpen = true; customDraft = errs.length ? text : ''; customFlash = { text: out, ok: !errs.length };
  renderHome(); customDraft = '';
}

/* ---------- events ---------- */
app.addEventListener('click', e=>{
  const el = e.target.closest('[data-act]'); if(!el || el.disabled) return;
  const act = el.dataset.act;
  switch(act){
    case 'chapter': { const t = el.dataset.topic; const ch = chapterOf(t); startPlay(allQuestions().filter(q=>q.t===t), ch.name, t); break; }
    case 'weak': startPlay(allQuestions().filter(q=>statusOf(q.id)==='weak'), 'Ôn lại câu sai', 'weak'); break;
    case 'exam': startExam(); break;
    case 'retry': startPlay(session.items.filter(it=>it.picked!==it.q.a).map(it=>it.q), 'Chơi lại câu sai', 'retry'); break;
    case 'again': { const s = session; startPlay(s.items.map(it=>it.q), s.title, s.key); break; }
    case 'home': renderHome(); break;
    case 'pick': answer(Number(el.dataset.k)); break;
    case 'next': next(); break;
    case 'prev': prev(); break;
    case 'jump': if(session && session.mode==='exam'){ session.i = Number(el.dataset.i); renderGame(true); } break;
    case 'submit': {
      const left = session.items.filter(x=>x.picked===null).length;
      if(left && needsConfirm(el, 'submit', `Còn ${left} câu chưa làm. Bấm lần nữa để nộp`)) break;
      submitExam(); break;
    }
    case 'exit': {
      if(session && session.mode==='exam' && !session.done && needsConfirm(el, 'exit', 'Thoát?')) { el.setAttribute('aria-label','Bấm lần nữa để thoát, bài thi sẽ không được lưu'); break; }
      renderHome(); break;
    }
    case 'toggle-timer': state.prefs.timer = !state.prefs.timer; persist(); el.setAttribute('aria-checked', state.prefs.timer); break;
    case 'toggle-sound': state.prefs.sound = !state.prefs.sound; persist(); el.setAttribute('aria-checked', state.prefs.sound); if(state.prefs.sound) sound('tap'); break;
    case 'sound-quick': state.prefs.sound = !state.prefs.sound; persist(); el.textContent = state.prefs.sound ? '🔊' : '🔇'; el.setAttribute('aria-label', state.prefs.sound ? 'Tắt âm thanh' : 'Bật âm thanh'); break;
    case 'add-custom': addCustom(); break;
    case 'clear-custom': {
      if(needsConfirm(el, 'clear', 'Bấm lần nữa để xoá hết câu đã thêm')) break;
      state.custom.forEach(q=>{ delete state.stats[q.id]; });
      state.custom = []; persist(); customOpen = true; customFlash = { text:'Đã xoá các câu tự thêm.', ok:true }; renderHome(); break;
    }
    case 'reset': {
      if(needsConfirm(el, 'reset', 'Bấm lần nữa để xoá toàn bộ tiến độ')) break;
      state.stats = {}; persist(); renderHome(); break;
    }
  }
});
document.addEventListener('toggle', e=>{ if(e.target && e.target.id==='customBox') customOpen = e.target.open; }, true);
document.addEventListener('keydown', e=>{
  if(!session || session.done) return;
  const tag = (e.target.tagName||'').toLowerCase();
  if(tag==='textarea' || tag==='input') return;
  if(e.metaKey || e.ctrlKey || e.altKey) return;
  const it = cur();
  let k = -1;
  if(/^[1-6]$/.test(e.key)) k = Number(e.key)-1;
  else if(/^[a-fA-F]$/.test(e.key)) k = 'abcdef'.indexOf(e.key.toLowerCase());
  if(k>=0 && k<it.order.length){ e.preventDefault(); answer(k); return; }
  if(e.key==='Enter'){ if(tag==='button') return; if(session.mode==='play' && it.picked!==null){ e.preventDefault(); next(); } return; }
  if(e.key==='ArrowRight'){ if(session.mode==='exam' || it.picked!==null){ e.preventDefault(); next(); } return; }
  if(e.key==='ArrowLeft' && session.mode==='exam'){ e.preventDefault(); prev(); }
});

renderHome();
initCloud();
})();
</script>
